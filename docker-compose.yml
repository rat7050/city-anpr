version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: city_anpr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/city_anpr
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change-this-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  ai-worker:
    build:
      context: .
      dockerfile: docker/ai-worker.Dockerfile
    environment:
      API_BASE_URL: http://backend:8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/city_anpr
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  pgdata:
  uploads:
